<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="TechVault-Logo.png" />
    <link href="/src/index.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Primary Meta Tags ===== -->
    <title>TechVault – Trusted Tech, Made Accessible</title>
    <meta
      name="description"
      content="TechVault is Nepal's trusted tech e-commerce platform. Shop authentic electronics, gadgets, and accessories from top brands like Apple, Samsung, Sony, and more."
    />
    <meta name="author" content="TechVault" />
    <link rel="canonical" href="https://ecom.hritamatya.name.np/" />

    <meta name="robots" content="index, follow" />

    <!-- ===== Open Graph (Facebook, LinkedIn, etc.) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechVault" />
    <meta property="og:title" content="TechVault – Trusted Tech, Made Accessible" />
    <meta
      property="og:description"
      content="TechVault is Nepal's trusted tech e-commerce platform. Shop authentic electronics, gadgets, and accessories from top brands like Apple, Samsung, Sony, and more."
    />
    <meta property="og:url" content="https://ecom.hritamatya.name.np/" />
    <meta property="og:image" content="https://ecom.hritamatya.name.np/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechVault – Trusted Tech, Made Accessible" />
    <meta
      name="twitter:description"
      content="TechVault is Nepal's trusted tech e-commerce platform. Shop authentic electronics, gadgets, and accessories from top brands."
    />
    <meta name="twitter:image" content="https://ecom.hritamatya.name.np/og-image.jpg" />
    <meta name="twitter:creator" content="@techvault" />

    <!-- ===== Theme Color ===== -->
    <meta name="theme-color" content="#1A2A6C" />

    <!-- ===== Structured Data (Organization) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TechVault",
        "url": "https://ecom.hritamatya.name.np/",
        "logo": "https://ecom.hritamatya.name.np/TechVault-Logo.png",
        "description": "TechVault is Nepal's trusted tech e-commerce platform, offering authentic electronics, gadgets, and accessories from top brands.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ghattekulo Chowk",
          "addressLocality": "Kathmandu",
          "addressCountry": "NP"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+977-9742935093",
          "contactType": "customer service",
          "availableLanguage": ["English", "Nepali"]
        },
        "sameAs": [
          "https://www.facebook.com/techvault",
          "https://www.instagram.com/techvault",
          "https://www.linkedin.com/company/techvault"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
